<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="application-name" content="EdhyX">
<meta name="apple-mobile-web-app-title" content="EdhyX">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>martaedhyx</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='black'/%3E%3Ccircle cx='50' cy='50' r='40' fill='white'/%3E%3Crect x='30.5' y='31' width='9' height='28' rx='4.5'/%3E%3Crect x='60.5' y='31' width='9' height='28' rx='4.5'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#000000; --side:#000000; --panel:#0d0d0d; --ink:#ffffff; --muted:rgba(255,255,255,.62); --line:#2e2e2e;
  --accent:#ffffff; --accent-ink:#000000; --user:#1a1a1a; --code:#141414; --err:#ff6b6b; --hover:#1c1c1c;
  --serif: ui-serif, Georgia, "Times New Roman", serif;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme: dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}@supports (height:100dvh){html,body{height:100dvh}}
body{background:var(--bg);color:var(--ink);font:16px/1.55 var(--sans);display:flex;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0}
button:focus-visible,textarea:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* Sidebar */
#side{width:288px;background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;
  padding:calc(12px + env(safe-area-inset-top,0px)) 10px calc(12px + env(safe-area-inset-bottom,0px));flex-shrink:0;z-index:30}
.brand{display:flex;align-items:center;min-height:46px;padding:3px 14px 7px}
.brand-name{font-family:var(--sans);font-size:26.52px;font-weight:700;line-height:1.4;color:#fff;letter-spacing:0}
#title{display:none!important}
.newbtn{display:flex;align-items:center;gap:10px;width:100%;padding:10px;border-radius:10px;font-weight:600;color:#fff;background:#000}
.newbtn:hover,.ci:hover,.foot:hover{background:var(--hover)}
.newbtn i,.clear-history i{display:inline-grid;place-items:center;width:26px;height:26px;flex:0 0 26px;border-radius:50%;border:1px solid #fff;background:#000;color:#fff;font-style:normal;font-size:19.8px;line-height:1}
.lbl{color:var(--muted);font-size:14.3px;padding:16px 10px 6px}
#list{list-style:none;margin:0;padding:0;overflow-y:auto;flex:1}
#list li{display:flex;align-items:center;border-radius:10px}
#list li.on{background:var(--hover)}
.ci{flex:1;min-width:0;text-align:left;padding:8px 10px;border-radius:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.del{color:var(--muted);padding:6px 10px;border-radius:8px;opacity:.7}
.del:hover{color:var(--err);opacity:1}
.foot{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:10px;border-radius:10px;margin-top:8px}
 .foot-icon{display:inline-grid;place-items:center;width:26px;height:26px;flex:0 0 26px;color:#fff;font-size:18px;line-height:1}
.none{color:var(--muted);font-size:15.4px;padding:6px 10px}
#scrim{display:none}

/* Main */
main{flex:1;min-width:0;min-height:0;display:flex;flex-direction:column;height:100%}
.top{display:flex;align-items:center;gap:8px;padding:calc(8px + env(safe-area-inset-top,0px)) 12px 8px}
#menuBtn{display:none;width:36px;height:32px;padding:4px;border-radius:10px;align-items:center;justify-content:center}
.menu-lines{display:flex;flex-direction:column;align-items:center;gap:2.25px;width:16px}
.menu-lines span{display:block;width:16px;height:1.45px;border-radius:2px;background:currentColor}
#menuBtn:hover{background:var(--hover)}
#title{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#modelLabel{margin-left:auto;color:var(--muted);font-size:14.3px;white-space:nowrap;display:none}
#chat{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:8px 16px 16px}
.wrap{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:18px;min-height:100%}
.hello{margin:auto;text-align:center;padding:40px 0}
.hello svg{display:block;margin:0 auto 20px}
.hello h1{font:400 clamp(28px,6vw,40px)/1.2 var(--serif);margin:0 0 8px;height:2.4em;display:flex;align-items:center;justify-content:center}
.hello p{margin:0;color:var(--muted)}

.msg.user{align-self:flex-end;max-width:85%;background:var(--user);padding:10px 16px;border-radius:18px;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.bot{align-self:stretch;font:17px/1.65 var(--serif);overflow-wrap:anywhere}
.msg.bot p{margin:0 0 .8em}
.msg.bot em{font-style:italic}
.msg.bot .md-table-wrap{max-width:100%;overflow-x:auto;overscroll-behavior-x:contain;scrollbar-width:thin;margin:1em 0;border:1px solid var(--line);border-radius:12px;background:var(--panel)}
.msg.bot .md-table{border-collapse:separate;border-spacing:0;width:100%;font:13.5px/1.55 var(--sans);min-width:660px;table-layout:fixed}
.msg.bot .md-table th,.msg.bot .md-table td{width:25%;padding:11px 12px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line);overflow-wrap:anywhere;word-break:normal}
.msg.bot .md-table th{font-size:12px;font-weight:750;letter-spacing:.025em;background:var(--code);color:var(--text)}
.msg.bot .md-table th:first-child,.msg.bot .md-table td:first-child{width:105px;font-weight:700}
.msg.bot .md-table tbody tr:nth-child(even){background:rgba(127,127,127,.055)}
.msg.bot .md-table tbody tr:last-child td{border-bottom:0}
.msg.bot .md-table td br{display:block;content:"";margin:.35em 0}
.msg.bot .mermaid-block{max-width:100%;overflow-x:auto;margin:.8em 0;padding:12px;background:var(--code);border:1px solid var(--line);border-radius:10px;text-align:center}
.msg.bot .mermaid-block svg{max-width:100%;height:auto}
.msg.bot .edhychart-wrap{position:relative;width:100%;height:280px;margin:.8em 0;padding:12px;background:var(--code);border:1px solid var(--line);border-radius:10px}
.msg.bot .edhychart-wrap canvas{max-width:100%}
.msg.bot .chart-error{border-color:#ef4444;color:#fca5a5}

.msg.bot h2,.msg.bot h3,.msg.bot h4{font-family:var(--serif);margin:1em 0 .4em;line-height:1.3;font-weight:750}
.msg.bot h2:nth-of-type(6n+1),.msg.bot h3:nth-of-type(6n+1),.msg.bot h4:nth-of-type(6n+1){color:#5eead4}
.msg.bot h2:nth-of-type(6n+2),.msg.bot h3:nth-of-type(6n+2),.msg.bot h4:nth-of-type(6n+2){color:#fbbf24}
.msg.bot h2:nth-of-type(6n+3),.msg.bot h3:nth-of-type(6n+3),.msg.bot h4:nth-of-type(6n+3){color:#fb7185}
.msg.bot h2:nth-of-type(6n+4),.msg.bot h3:nth-of-type(6n+4),.msg.bot h4:nth-of-type(6n+4){color:#c4b5fd}
.msg.bot h2:nth-of-type(6n+5),.msg.bot h3:nth-of-type(6n+5),.msg.bot h4:nth-of-type(6n+5){color:#86efac}
.msg.bot h2:nth-of-type(6n),.msg.bot h3:nth-of-type(6n),.msg.bot h4:nth-of-type(6n){color:#7dd3fc}
.msg.bot h2{font-size:1.3em}.msg.bot h3{font-size:1.15em}.msg.bot h4{font-size:1.05em}
.msg.bot ul,.msg.bot ol{margin:0 0 .8em;padding-left:1.4em}
.msg.bot li{margin:.2em 0}
.msg.bot pre{background:var(--code);border:1px solid var(--line);padding:12px;border-radius:10px;overflow-x:auto;margin:.8em 0;font:13.5px/1.5 ui-monospace,Menlo,Consolas,monospace}
.msg.bot code{background:var(--code);padding:1px 5px;border-radius:5px;font:.88em ui-monospace,Menlo,Consolas,monospace}
.msg.bot pre code{background:none;padding:0;font-size:inherit}.msg.bot a.md-link{color:#eee;text-decoration-line:underline;text-decoration-style:dotted;text-decoration-color:#aaa;text-underline-offset:4px;overflow-wrap:anywhere}.msg.bot .site-icon{width:14px;height:14px;object-fit:contain;vertical-align:-2px;margin-right:5px;border-radius:3px}.msg.bot .task{list-style:none;margin-left:-1.4em}.msg.bot .task input{accent-color:#22c55e;width:14px;height:14px;vertical-align:-2px;margin-right:7px}.msg.bot pre{position:relative;padding:38px 12px 12px;background:#101318;border:1px solid #30343b;border-radius:10px;overflow-x:auto}.msg.bot .code-lang{position:absolute;top:9px;left:12px;color:#aeb7c4;font-size:12.1px}.msg.bot .code-copy{position:absolute;top:5px;right:7px;border:1px solid #424852;border-radius:6px;padding:3px 7px;font-size:12.1px}
.msg.err{align-self:stretch;color:var(--ink);border:1px solid var(--err);border-radius:12px;padding:10px 14px;font-size:16.5px}
.copy{color:var(--muted);font-size:14.3px;padding:2px 8px;margin-left:-8px;border-radius:8px}
.copy:hover{background:var(--hover)}
.msg.bot>.copy{display:inline-flex;align-items:center;justify-content:center;min-width:30px;height:28px;margin:5px 1px 0 0;padding:4px 6px;border:1px solid transparent;border-radius:8px;vertical-align:middle}
.msg.bot>.copy:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.typing{color:var(--muted);font-style:italic;font-size:13.2px}
@media (prefers-reduced-motion: no-preference){ .typing{animation:pulse 1.5s ease-in-out infinite} @keyframes pulse{0%,100%{opacity:.5}50%{opacity:1}} }

/* Input */
.dock{padding:8px 16px calc(14px + env(safe-area-inset-bottom,0px))}
.box{max-width:720px;margin:0 auto;background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:10px;display:flex;align-items:flex-end;gap:8px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.box:focus-within{border-color:var(--accent)}
.box textarea{flex:1;resize:none;border:0;background:none;color:var(--ink);font:16px/1.5 var(--sans);padding:6px 0;max-height:160px;outline:none}
#sendBtn{width:36px;height:36px;border-radius:50%;background:#000;color:#fff;display:grid;place-items:center;flex-shrink:0}
#sendBtn:disabled{opacity:.4;cursor:default}
.box{position:relative}
#plusBtn{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font-size:24.2px;line-height:1;flex-shrink:0;color:var(--ink)}
#plusBtn:hover{background:var(--hover)}
#menu{display:none;position:absolute;left:8px;bottom:calc(100% + 8px);background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:6px;min-width:230px;z-index:10;box-shadow:0 8px 24px rgba(0,0,0,.6)}
#menu.on{display:block}
#menu button{display:block;width:100%;text-align:left;padding:10px 12px;border-radius:10px}
#menu button:hover{background:var(--hover)}
#chips{max-width:720px;margin:0 auto 8px;display:flex;flex-wrap:wrap;gap:8px}
#chips:empty{display:none}
.chip{display:flex;align-items:center;gap:8px;background:var(--user);border:1px solid var(--line);border-radius:12px;padding:4px 6px 4px 8px;font-size:15.4px;max-width:100%}
.chip.mode{border-color:var(--accent)}
.chip img{width:32px;height:32px;object-fit:cover;border-radius:6px}
.chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:170px}
.chip button{padding:0 6px;font-size:19.8px;color:var(--muted)}
.thumb{display:block;max-width:220px;max-height:220px;border-radius:12px;margin-bottom:8px}
.file{font-size:15.4px;margin-bottom:6px}
.msg.bot img.gen{display:block;max-width:100%;border-radius:12px;margin:.6em 0}
#micBtn{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;flex-shrink:0;color:var(--ink)}
#micBtn:hover{background:var(--hover)}
#micBtn.on{background:var(--accent);color:var(--accent-ink)}
.lens button[data-p]{display:block;width:100%;text-align:left;padding:12px 14px;border:1px solid var(--line);border-radius:12px;margin-top:8px}
.lens button[data-p]:hover{background:var(--hover)}
.src{font-size:13px!important;color:var(--muted);margin-top:16px;display:flex;flex-direction:column;align-items:stretch;gap:8px;width:100%;max-width:620px}
.src-heading{width:100%;font-size:12px!important;color:var(--muted);font-weight:650;padding:0 2px 2px}
.src .src-card{display:flex;align-items:center;gap:10px;width:100%;min-width:0;max-width:100%;box-sizing:border-box;padding:9px 11px;border:1px solid var(--line);border-radius:12px;background:var(--panel);color:inherit;text-decoration:none;transition:border-color .15s,background .15s;min-height:54px;overflow:hidden}
.src .src-card:hover{border-color:#888;background:var(--hover)}
.list-source{margin:6px 0 2px;padding:6px 9px;border-left:2px solid var(--line);font-size:.88em;color:var(--muted)}
.list-source .md-link{display:inline-flex;align-items:center;gap:6px;overflow-wrap:anywhere}
.list-source .site-icon{width:16px;height:16px;object-fit:contain;vertical-align:middle}
.src .src-thumb{width:30px!important;height:30px!important;flex:0 0 30px;object-fit:contain;border-radius:8px;background:#fff;padding:3px;border:1px solid var(--line)}
.src .src-preview-thumb{width:76px;height:50px;flex:0 0 76px;object-fit:cover;border-radius:8px;background:#171717;margin-left:auto;border:1px solid var(--line)}
.msg.bot .md-link .site-icon{width:14px;height:14px;flex:0 0 14px}
.src .src-meta{display:flex;flex-direction:column;min-width:0;gap:1px}
.src .src-meta strong{font-size:12px!important;line-height:1.25;font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.src .src-meta small{font-size:10px!important;line-height:1.2;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.msg.bot .md-image-thumb{display:block;max-width:min(100%,560px);max-height:360px;object-fit:contain;border:1px solid var(--line);border-radius:12px;margin:10px 0}
.msg.bot .md-image-link{display:inline-block;max-width:100%}
.note{max-width:720px;margin:6px auto 0;text-align:center;color:var(--muted);font-size:12.1px!important}

textarea::placeholder,input::placeholder{color:var(--muted);opacity:1}
.logo{display:block}
.logo .eyes{transform:translate(calc(var(--ex,0) * 1px),calc(var(--ey,0) * 1px));transition:transform .16s ease-out}
.logo .eye{transform-box:fill-box;transform-origin:center;transition:transform .1s}
.logo .eye.l{transform:translateY(calc(var(--dl,0) * 1px)) scaleY(calc(var(--sl,1) * var(--bl,1)))}
.logo .eye.r{transform:translateY(calc(var(--dr,0) * 1px)) scaleY(calc(var(--sr,1) * var(--bl,1)))}
.logo.blink{--bl:.08}
.msg.bot.typing{display:flex;align-items:center;gap:10px}
.msg.bot.typing .logo{flex-shrink:0}

/* Dialog */
dialog{border:1px solid var(--line);border-radius:16px;background:var(--panel);color:var(--ink);width:min(440px,92vw);padding:22px}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog h2{margin:0 0 6px;font:600 20px var(--serif)}
label{display:block;margin:14px 0 4px;font-size:15.4px;font-weight:600}
label span{display:block;font-weight:400;color:var(--muted);font-size:13.75px}
dialog input,dialog textarea{width:100%;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:9px 11px;font:inherit}
.row{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}
.row button{border:1px solid var(--line);border-radius:10px;padding:8px 14px}
.row .primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

@media (max-width:860px){
  #side{position:fixed;inset:0 auto 0 0;transform:translateX(-100%);transition:transform .2s;box-shadow:none}
  body.open #side{transform:none;box-shadow:4px 0 24px rgba(0,0,0,.25)}
  body.open #scrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:20}
  #menuBtn{display:block}
}
@media (prefers-reduced-motion: reduce){ #side{transition:none} }

.msg.bot .marta-name{color:#ff3030!important;font-weight:700!important}

*, *::before, *::after{font-family:var(--sans)!important;font-size:15.4px!important}
.msg.user,.msg.bot{font-size:15.4px!important;line-height:1.6!important}
.msg.bot h2{font-size:17.4px!important;line-height:1.3!important}
.msg.bot h3{font-size:16.2px!important;line-height:1.3!important}
.msg.bot h4{font-size:15.4px!important;line-height:1.3!important}
.msg.bot .md-table{font-size:13.2px!important;line-height:1.45!important;min-width:0!important}
.msg.bot .md-table th,.msg.bot .md-table td{padding:8px 9px!important}
input, textarea{font-size:17.6px!important}

.msg.bot pre{
  background:#05070b!important;
  border:1px solid #f4f8ff!important;
  box-shadow:0 0 3px rgba(255,255,255,.95),0 0 10px rgba(255,255,255,.22),inset 0 0 12px rgba(255,255,255,.035)!important;
  color:#f4f7ff!important;
  text-shadow:0 0 2px rgba(255,255,255,.22);
  -webkit-font-smoothing:antialiased;
}
.msg.bot pre code{
  color:#f4f7ff!important;
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace!important;
  font-size:14.3px!important;
  line-height:1.65!important;
}
.msg.bot pre .hljs-keyword,
.msg.bot pre .hljs-selector-tag,
.msg.bot pre .hljs-literal,
.msg.bot pre .hljs-meta .hljs-keyword,
.msg.bot pre .hljs-doctag{color:#ff365f!important;text-shadow:0 0 5px rgba(255,54,95,.42)}
.msg.bot pre .hljs-title,
.msg.bot pre .hljs-title.function_,
.msg.bot pre .hljs-function .hljs-title,
.msg.bot pre .hljs-attr,
.msg.bot pre .hljs-attribute,
.msg.bot pre .hljs-property,
.msg.bot pre .hljs-selector-id,
.msg.bot pre .hljs-selector-class{color:#35baff!important;text-shadow:0 0 5px rgba(53,186,255,.4)}
.msg.bot pre .hljs-string,
.msg.bot pre .hljs-regexp,
.msg.bot pre .hljs-template-variable,
.msg.bot pre .hljs-addition{color:#42f58d!important;text-shadow:0 0 5px rgba(66,245,141,.38)}
.msg.bot pre .hljs-number,
.msg.bot pre .hljs-symbol,
.msg.bot pre .hljs-bullet{color:#ffd166!important}
.msg.bot pre .hljs-built_in,
.msg.bot pre .hljs-type,
.msg.bot pre .hljs-class .hljs-title{color:#c6a0ff!important}
.msg.bot pre .hljs-comment,
.msg.bot pre .hljs-quote{color:#9aa7b8!important;font-style:italic}
.msg.bot pre .hljs-variable,
.msg.bot pre .hljs-params,
.msg.bot pre .hljs-name,
.msg.bot pre .hljs-tag{color:#f4f7ff!important}
.msg.bot pre .code-lang{color:#ffffff!important;text-shadow:0 0 6px rgba(255,255,255,.5)}
.msg.bot pre .code-copy{border-color:#f4f8ff!important;color:#ffffff!important;box-shadow:0 0 5px rgba(255,255,255,.22)}
.msg.bot pre .code-copy:hover{background:#ffffff!important;color:#05070b!important}

.clear-history{display:flex;align-items:center;gap:10px;width:100%;margin:0;padding:10px;border:0;border-radius:10px;text-align:left;font:inherit;font-weight:600;line-height:1.55;color:#fff;background:#000}
.clear-history:hover{background:var(--hover)}

.msg.bot.typing,.msg.bot.typing *{font-size:15.4px!important;line-height:1.35!important;font-style:italic!important}
.msg.bot.typing .logo{font-size:initial!important}
@media (prefers-reduced-motion: no-preference){
  .msg.bot.typing{animation:none!important;opacity:1!important}
  .msg.bot.typing > span{animation:pulse 1.5s ease-in-out infinite}
}
</style>
</head>
<body>

<aside id="side" aria-label="Menu">
  <div class="brand" id="brand"><span class="brand-name">EdhyX</span></div>
  <button class="newbtn" id="newBtn" type="button"><i>+</i> Obrolan Baru</button>
  <button class="clear-history" id="clearHistoryBtn" type="button"><i>−</i> Hapus Riwayat Chat</button>
  <ul id="list"></ul>
  <button class="foot" id="settingsBtn" type="button"><span class="foot-icon" aria-hidden="true">⚙</span> Pengaturan</button>
</aside>
<div id="scrim"></div>

<main>
  <div class="top">
    <button id="menuBtn" type="button" aria-label="Buka menu"><span class="menu-lines" aria-hidden="true"><span></span><span></span><span></span></span></button>
    <div id="title">Chat baru</div>
    <div id="modelLabel"></div>
  </div>
  <div id="chat" aria-live="polite"><div class="wrap" id="wrap"></div></div>
  <div class="dock">
    <div id="chips"></div>
    <form class="box" id="form">
      <div id="menu" role="menu">
        <button type="button" id="mFile">Lampirkan file atau foto</button>
        <button type="button" id="mCam">Ambil foto</button>
        <button type="button" id="mLens">Lens: baca gambar</button>
        <button type="button" id="mLoc">Bagikan lokasi (GPS)</button>
        <button type="button" id="mWeb">Cari di web</button>
        <button type="button" id="mImg">Buat gambar</button>
      </div>

  var lastGreeting = '';
  function updateGreeting(){
    var hourText = new Intl.DateTimeFormat('en-GB', {
      timeZone:'Asia/Jakarta', hour:'2-digit', hourCycle:'h23'
    }).format(new Date());
    var hour = Number(hourText);
    var period = hour >= 4 && hour < 11 ? 'pagi'
      : hour >= 11 && hour < 15 ? 'siang'
      : hour >= 15 && hour < 18 ? 'sore' : 'malam';
    var greetings = [
      'Lagi sibuk apa hari ini?',
      'Bagaimana aktivitasmu ' + period + ' ini?',
      'Ada cerita menarik hari ini?',
      'Mau mencari tahu sesuatu yang baru?',
      'Apa yang bisa kita kerjakan bersama hari ini?',
      'Ada hal yang sedang kamu pikirkan?',
      'Siap membantu. Mau mulai dari mana?',
      'Hari ini ingin ngobrol tentang apa?',
      'Punya rencana menarik untuk hari ini?',
      'Butuh bantuan menyelesaikan sesuatu?',
      'Apa kabar? Semoga harimu menyenangkan.',
      'Ada pertanyaan yang ingin kamu pecahkan?'
    ];
    var greeting = $('greeting');
    if (!greeting) return;
    var next = lastGreeting;
    while (greetings.length > 1 && next === lastGreeting){
      next = greetings[Math.floor(Math.random() * greetings.length)];
    }
    lastGreeting = next;
    greeting.textContent = next;
  }

  var TEXT_EXT = 'txt md csv tsv json xml html htm css js ts jsx tsx py java c h cpp cs go rs rb php sql yml yaml toml ini log sh bat r swift kt'.split(' ');
  var MIME_EXT = { pdf:'application/pdf', mp3:'audio/mpeg', wav:'audio/wav', m4a:'audio/mp4', aac:'audio/aac', ogg:'audio/ogg', flac:'audio/flac',
    mp4:'video/mp4', mov:'video/quicktime', webm:'video/webm', png:'image/png', jpg:'image/jpeg', jpeg:'image/jpeg', webp:'image/webp', heic:'image/heic', gif:'image/gif' };
  function readAs(f, how){
    return new Promise(function(ok, no){ var r = new FileReader(); r.onload = function(){ ok(r.result); }; r.onerror = no; r[how](f); });
  }
  async function addFile(f){
    var ext = (f.name.split('.').pop() || '').toLowerCase();
    var mime = f.type || MIME_EXT[ext] || '';
    var media = /^(image|video|audio)\//.test(mime) || mime === 'application/pdf';
    if (media){
      var used = pending.reduce(function(n, a){ return n + a.size; }, 0);
      if (used + f.size > 15 * 1024 * 1024) return '"' + f.name + '" terlalu besar. Total lampiran maksimal sekitar 15 MB.';
      var url = await readAs(f, 'readAsDataURL');
      pending.push({ name:f.name, size:f.size, part:{ inlineData:{ mimeType:mime, data:url.split(',')[1] } }, preview: mime.indexOf('image/') === 0 ? url : null });
      return '';
    }
    var txt = null;
    if (ext === 'docx' && window.mammoth){
      txt = (await window.mammoth.extractRawText({ arrayBuffer: await readAs(f, 'readAsArrayBuffer') })).value;
    } else if (/^(xlsx|xls|xlsm|ods)$/.test(ext) && window.XLSX){
      var wb = window.XLSX.read(await readAs(f, 'readAsArrayBuffer'), { type:'array' });
      txt = wb.SheetNames.map(function(n){ return '## Sheet: ' + n + '\n' + window.XLSX.utils.sheet_to_csv(wb.Sheets[n]); }).join('\n\n');
    } else if (mime.indexOf('text/') === 0 || TEXT_EXT.indexOf(ext) >= 0 || /json|xml|javascript/.test(mime)){
      txt = await readAs(f, 'readAsText');
    }
    if (txt === null) return 'Format "' + f.name + '" belum bisa dibaca. Coba simpan sebagai PDF atau teks.';
    if (txt.length > 200000) txt = txt.slice(0, 200000) + '\n[dipotong]';
    pending.push({ name:f.name, size:f.size, part:{ text:'[Isi file: ' + f.name + ']\n' + txt }, preview:null });
    return '';
  }

    if (status === 429) return 'Batas pemakaian gratis tercapai. Tunggu satu menit lalu coba lagi.' + hint;

nti. Untuk pertanyaan sederhana, jawab singkat. Untuk pertanyaan kompleks, susun jawaban dengan judul atau poin bernomor bila membantu; jelaskan langkah penting, fakta, asumsi, dan kesimpulan secara ringkas. Tampilkan alasan atau ringkasan penalaran yang bisa dipahami, bukan penalaran internal tersembunyi. Gunakan bahasa pengguna, hindari pengulangan, basa-basi panjang, dan klaim yang tidak pasti.\n\nRiset dan pencarian: jika alat web tersedia dan pertanyaan membutuhkan informasi terbaru, fakta yang dapat berubah, verifikasi, atau riset, lakukan penelusuran sebelum menjawab. Pecah pertanyaan kompleks menjadi beberapa subpertanyaan atau sudut pencarian yang relevan. Gunakan hasil pencarian untuk menemukan halaman sumber, lalu baca halaman penting secara lebih mendalam bila alat konteks URL tersedia. Utamakan sumber primer/resmi dan sumber independen yang kredibel; bandingkan beberapa sumber untuk klaim penting. Perhatikan tanggal publikasi dan tanggal kejadian, bedakan fakta, perkiraan, dan opini, serta jelaskan bila sumber bertentangan atau bukti belum cukup. Sertakan tautan sumber yang benar-benar digunakan. Jangan mengarang sumber, kutipan, angka, atau kepastian. Untuk pertanyaan sederhana dan pengetahuan yang stabil, jangan memaksakan pencarian.\n\nATURAN WAJIB BERITA DAN SUMBER: Setiap berita yang disebut harus memiliki URL langsung ke halaman artikel, judul artikel spesifik, nama penerbit, dan tanggal publikasi yang tertera atau terverifikasi. Jangan gunakan URL beranda, kategori, tag, pencarian, agregator, atau portal umum sebagai pengganti artikel. Jangan menebak judul, penerbit, tanggal, atau URL. Jika satu saja dari empat unsur tidak ditemukan atau tidak dapat diverifikasi, jangan tampilkan berita itu sebagai berita terverifikasi; nyatakan: "Sumber artikel belum ditemukan." Jika tidak ada berita yang lolos, katakan sumber artikel belum ditemukan dan jangan menyusun daftar berita dari ingatan. Aturan ini berlaku untuk hasil pencarian Tavily yang disediakan oleh Cloudflare Worker.';

<script>

    }

    }

        var b1 = clone(body); b1.tools = [{ google_search: {} }]; delete b1.toolConfig;

          res = await orig(url, withBody(opts, b2));
        }
      }
      if (!(await hasAnswer(res)) && used !== BACKUP) {
        var b3 = clone(body);
        if (!requiresWeb) { delete b3.tools; delete b3.toolConfig; }
        res = await orig(swap(url, BACKUP), withBody(opts, b3));
      }
    }
    return res;
  };

<!-- Cloudflare Worker chat bridge -->
<script>
(function () {
  'use strict';
  if (window.__edhyCloudflareBridgeLoaded) return;
  window.__edhyCloudflareBridgeLoaded = true;

  var WORKER_URL = 'https://chat-api.8jjjjmdn2v.workers.dev';
  var originalFetch = window.fetch.bind(window);
  var $ = function (id) { return document.getElementById(id); };

  function getText(parts) {
    return (parts || []).map(function (part) {
      return typeof part.text === 'string' ? part.text : '';
    }).filter(Boolean).join('\n').trim();
  }

  function isImageRequest(body) {
    return !!(body.generationConfig &&
      body.generationConfig.responseModalities &&
      body.generationConfig.responseModalities.indexOf('IMAGE') >= 0);
  }

  function hasInlineImage(body) {
    return (body.contents || []).some(function (item) {
      return (item.parts || []).some(function (part) {
        return !!(part.inlineData || part.fileData);
      });
    });
  }

  function convertConversation(body) {
    var items = (body.contents || []).filter(function (item) {
      return item && (item.role === 'user' || item.role === 'model');
    });
    var lastUser = -1;
    for (var i = items.length - 1; i >= 0; i--) {
      if (items[i].role === 'user' && getText(items[i].parts)) {
        lastUser = i;
        break;
      }
    }
    if (lastUser < 0) throw new Error('Pesan pengguna tidak ditemukan.');

    var message = getText(items[lastUser].parts);
    var history = items.slice(0, lastUser).map(function (item) {
      return {
        role: item.role === 'model' ? 'assistant' : 'user',
        content: getText(item.parts)
      };
    }).filter(function (item) { return !!item.content; }).slice(-10);

    return { message: message, history: history };
  }

  function workerResponse(data) {
    var chunks = (data.sources || []).filter(function (source) {
      return source && /^https?:\/\//i.test(source.url || '');
    }).map(function (source) {
      return { web: { uri: source.url, title: source.title || source.url } };
    });

    var payload = {
      candidates: [{
        content: { role: 'model', parts: [{ text: data.text || '' }] },
        finishReason: 'STOP',
        groundingMetadata: { groundingChunks: chunks, searchStatus: data.searchStatus || 'unknown', provider: data.provider || 'Cloudflare Worker' }
      }],
      edhyProvider: data.provider || 'Cloudflare Worker',
      edhySearchStatus: data.searchStatus || 'unknown',
      edhyImages: data.images || []
    };

    return new Response(JSON.stringify(payload), {
      status: 200,
      headers: { 'Content-Type': 'application/json; charset=utf-8' }
    });
  }

  window.fetch = async function (url, options) {
    var target = typeof url === 'string' ? url : (url && url.url) || '';

    // Pembuatan gambar dan analisis lampiran visual tetap memakai jalur Gemini lama.
    if (target.indexOf('generativelanguage.googleapis.com') < 0 ||
        !options || !options.body) {
      return originalFetch(url, options);
    }

    var body;
    try { body = JSON.parse(options.body); }
    catch (error) { return originalFetch(url, options); }

    if (isImageRequest(body) || hasInlineImage(body)) {
      return originalFetch(url, options);
    }

    var conversation;
    try { conversation = convertConversation(body); }
    catch (error) { throw error; }

    var systemText = body.system_instruction && body.system_instruction.parts
      ? getText(body.system_instruction.parts)
      : '';

    var message = conversation.message;
    if (systemText) {
      message = 'INSTRUKSI ASISTEN EDHYX (ikuti sebagai pedoman menjawab):\n' +
        systemText.slice(0, 7000) +
        '\n\nPERTANYAAN PENGGUNA:\n' + message;
    }

    var response = await originalFetch(WORKER_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        message: message,
        history: conversation.history
      }),
      signal: options.signal
    });

    var data = await response.json().catch(function () { return {}; });
    if (!response.ok) {
      var details = Array.isArray(data.details) ? data.details.join(' | ') : '';
      throw new Error(data.error || details || ('Cloudflare Worker HTTP ' + response.status));
    }

    var label = $('modelLabel');
    if (label) label.textContent = 'via ' + (data.provider || 'Cloudflare Worker');

    return workerResponse(data);
  };

  // Tandai koneksi backend aktif pada pengaturan tanpa meminta API key Groq di browser.
  var dlg = $('dlg');
  var row = dlg && dlg.querySelector('.row');
  if (dlg && row && !document.getElementById('edhyWorkerInfo')) {
    var info = document.createElement('div');
    info.id = 'edhyWorkerInfo';
    info.style.cssText = 'padding:10px 12px;margin:10px 0;border:1px solid var(--line);border-radius:10px;font-size:13px;line-height:1.5;color:var(--muted)';
    info.textContent = 'Chat teks dan pencarian web menggunakan Cloudflare Worker (Groq → Gemini cadangan, Tavily). API key Groq dan Tavily disimpan sebagai Secret di Cloudflare, bukan di browser. API key Gemini di atas tetap dipakai untuk fitur gambar dan analisis lampiran.';
    dlg.insertBefore(info, row);
  }
})();
</script>

        pre.dataset.edhyDone = '1';
        var sheet = excelData.sheets[0];
        var cardX = makeCard('excel', excelData.title || 'Buku kerja Excel', 'Pratinjau lembar: ' + (sheet.name || 'Data'), [
          { label: 'Unduh Excel (.xlsx)', kind: 'excel', run: function () {
            if (!window.XLSX) { alert('Pustaka Excel belum termuat.'); return; }
            var wb = XLSX.utils.book_new();
            excelData.sheets.forEach(function (s, i) {
              var rows = []; if (s.headers) rows.push(s.headers);
              (s.rows || []).forEach(function (r) { rows.push(r); });
              var ws = XLSX.utils.aoa_to_sheet(rows);
              XLSX.utils.book_append_sheet(wb, ws, String(s.name || ('Sheet' + (i + 1))).slice(0, 31));
            });
            XLSX.writeFile(wb, safeName(excelData.title || 'edhy-data') + '.xlsx');
          } }
        ]);
        cardX.appendChild(tableNode(sheet.headers || [], sheet.rows || []));
        pre.parentNode.replaceChild(cardX, pre);
      }
    });
  }
  function process(root) { renderMarkdownTables(root); renderStructured(root); }
  var target = document.getElementById('wrap');
  if (!target) return;
  var observer = new MutationObserver(function () {
    window.clearTimeout(window.__edhyVisualScanTimer);
    window.__edhyVisualScanTimer = window.setTimeout(function () {
      document.querySelectorAll('#wrap .msg.bot').forEach(process);
    }, 80);
  });
  observer.observe(target, { childList: true, subtree: true });
  document.querySelectorAll('#wrap .msg.bot').forEach(process);
})();
</script>

  document.head.appendChild(style);

  function appendOutput(box, text, cls){
    var line = document.createElement('div');
    if(cls) line.className = cls;
    line.textContent = text;
    box.appendChild(line);
    box.scrollTop = box.scrollHeight;
  }
  async function request(action, extra){
    if(!API) throw new Error('Isi URL backend Vercel terlebih dahulu.');
    if(!accessKey) throw new Error('Isi Kode Akses Terminal terlebih dahulu.');
    var response = await fetch(API.replace(/\/$/, '') + '/api/terminal', {
      method:'POST', headers:{'Content-Type':'application/json','X-Terminal-Key':accessKey},
      body:JSON.stringify(Object.assign({action:action,token:token}, extra || {}))
    });
    var data = await response.json().catch(function(){return {};});
    if(!response.ok) throw new Error(data.error || ('HTTP '+response.status));
    if(data.token) token = data.token;
    return data;
  }
  function openTerminal(){
    var wrap = $('#wrap');
    if(!wrap) return;
    var old = $('#edhyTerminal', wrap);
    if(old){ old.scrollIntoView({behavior:'smooth',block:'center'}); return; }
    var card = document.createElement('section');

      </div>

        <div class="edhy-term-config">
          <input class="edhy-api" type="url" placeholder="URL backend Vercel (https://...vercel.app)" autocomplete="url">
          <input class="edhy-key" type="password" placeholder="Kode Akses Terminal" autocomplete="off">
        </div>
        <div class="edhy-term-toolbar"><button class="edhy-action edhy-start" type="button">▶ Mulai Terminal</button><button class="edhy-action edhy-stop" type="button" disabled>■ Akhiri Sesi</button></div>
        <p class="edhy-term-hint">Terminal Linux berjalan di sandbox cloud terisolasi, bukan di HP atau komputer mas. Sesi sementara; jangan masukkan password atau API key pribadi.</p>
        <div class="edhy-term-output" role="log" aria-live="polite">Edhy Terminal belum terhubung. Masukkan alamat backend dan kode akses.</div>
        <form class="edhy-term-line"><input class="edhy-command" type="text" placeholder="Ketik perintah, contoh: pwd" autocomplete="off" disabled><button class="edhy-action edhy-run" type="submit" disabled>Jalankan</button></form>
      </div>
      <div class="edhy-term-taskbar">
        <button class="edhy-task-start" type="button" title="Start">⊞</button>
        <div class="edhy-task-app"><span>›_</span><span>Edhy Terminal</span></div>
        <span class="edhy-task-spacer"></span>
        <span class="edhy-task-clock">EdhyX</span>
      </div>`;
    wrap.appendChild(card);
    var output = $('.edhy-term-output',card), cmd = $('.edhy-command',card), run = $('.edhy-run',card), start = $('.edhy-start',card), stop = $('.edhy-stop',card);
    $('.edhy-api',card).value = API;
    $('.edhy-api',card).addEventListener('change',function(){API=this.value.trim().replace(/\/$/,'');});
    $('.edhy-key',card).addEventListener('change',function(){accessKey=this.value.trim();});
    $('.edhy-win-close',card).addEventListener('click',function(){card.remove();});
    $('.edhy-win-min',card).addEventListener('click',function(){card.classList.toggle('is-minimized');});
    $('.edhy-win-max',card).addEventListener('click',function(){
      card.classList.toggle('is-maximized');
      $('.edhy-win-max',card).textContent = card.classList.contains('is-maximized') ? '❐' : '□';
      $('.edhy-win-max',card).title = card.classList.contains('is-maximized') ? 'Restore' : 'Maximize';
    });
    start.addEventListener('click',async function(){
      API=$('.edhy-api',card).value.trim().replace(/\/$/,'');
      accessKey=$('.edhy-key',card).value.trim();
      start.disabled=true; appendOutput(output,'Menyiapkan sandbox...','edhy-term-ok');
      try{
        var d=await request('start'); appendOutput(output,d.output || 'Sandbox siap.','edhy-term-ok');
        cmd.disabled=false;run.disabled=false;stop.disabled=false;cmd.focus();
      }catch(e){appendOutput(output,'ERROR: '+e.message,'edhy-term-error');}
      finally{start.disabled=false;}
    });
    $('.edhy-term-line',card).addEventListener('submit',async function(e){
      e.preventDefault(); var command=cmd.value.trim(); if(!command||!token)return;
      cmd.value=''; run.disabled=true; appendOutput(output,'$ '+command);
      try{
        var d=await request('run',{command:command});
        if(d.stdout) appendOutput(output,d.stdout);
        if(d.stderr) appendOutput(output,d.stderr,'edhy-term-error');
        if(d.exitCode!==0 && d.exitCode!==undefined) appendOutput(output,'[exit code '+d.exitCode+']','edhy-term-error');
        if(!d.stdout&&!d.stderr) appendOutput(output,'[Perintah selesai tanpa output]');
      }catch(e){appendOutput(output,'ERROR: '+e.message,'edhy-term-error');}
      finally{run.disabled=false;cmd.focus();}
    });
    stop.addEventListener('click',async function(){
      stop.disabled=true;run.disabled=true;cmd.disabled=true;
      try{await request('stop');appendOutput(output,'Sesi terminal diakhiri.','edhy-term-ok');}
      catch(e){appendOutput(output,'INFO: '+e.message,'edhy-term-error');}
      token='';run.disabled=true;cmd.disabled=true;start.disabled=false;

  function openMonitoring(){

      </div>

      <div class="edhy-monitor-foot"><span>SYS://EDHY-CORE</span><time class="edhy-monitor-clock">--/--/----</time></div>`;
    wrap.appendChild(card);
    var output=$('.edhy-monitor-output',card), clock=$('.edhy-monitor-clock',card);
    var lines=[
      ['root@edhy:~$ boot --system',''],
      ['[ OK ] Initializing system core...','ok'],
      ['[ OK ] Loading AI neural modules','ok'],
      ['[ OK ] Establishing secure session','ok'],
      ['> scanning memory blocks...','info'],
      ['0x00AF  0x19BC  0xFE21  0x0A77',''],
      ['01001001 01001110 01001001 01010100',''],
      ['> analyzing system data...','info'],
      ['[ INFO ] Signal detected','info'],
      ['[ OK ] Security layer active','ok'],
      ['> connecting intelligence engine...','info'],
      ['handshake://secure/channel',''],
      ['[ OK ] Connection established','ok'],
      ['> optimizing response engine...','info'],
      ['████████████████░░ 82%',''],
      ['[ OK ] System monitoring active','ok'],
      ['root@edhy:~$ monitor --live','']
    ];
    var i=0,timer=null,closed=false;
    function updateClock(){
      var now=new Date();
      clock.textContent=new Intl.DateTimeFormat('id-ID',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit',second:'2-digit',hourCycle:'h23'}).format(now);
    }
    function tick(){
      if(closed)return;
      var item=lines[i++%lines.length],line=document.createElement('div');
      line.textContent=item[0];
      if(item[1])line.className='edhy-monitor-line-'+item[1];
      output.appendChild(line);
      while(output.children.length>16)output.firstChild.remove();
      output.scrollTop=output.scrollHeight;
      timer=setTimeout(tick,380);
    }
    updateClock();
    var clockTimer=setInterval(updateClock,1000);
    card._edhyCleanup=function(){closed=true;clearTimeout(timer);clearInterval(clockTimer);};
    card.scrollIntoView({behavior:'smooth',block:'center'});
    tick();
  }

  function normalizeCommand(value){
    return String(value || '').toLocaleLowerCase('id-ID').trim().replace(/\s+/g,' ').replace(/[.!?]+$/,'');
  }
  function isComputerCommand(value){
    return /^(?:(?:edhy)[, ]+)?(?:tolong\s+)?(?:buka|tampilkan|jalankan)\s+(?:(?:panel|dasbor)\s+)?(?:edhyx\s+)?(?:computer|komputer|monitoring(?:\s+sistem)?|kontrol\s+sistem)(?:\s+sekarang)?$/i.test(normalizeCommand(value));
  }
  function isTerminalCommand(value){
    return /^(?:(?:edhy)[, ]+)?(?:tolong\s+)?(?:buka|akses|jalankan|masuk ke)\s+terminal$/i.test(normalizeCommand(value));
  }
  function handleEdhyCommand(e){
    var input=$('#text');
    var value=input && input.value || '';
    var computer=isComputerCommand(value), terminal=isTerminalCommand(value);
    if(!computer && !terminal) return;
    e.preventDefault();
    e.stopImmediatePropagation();
    if(input){input.value='';input.style.height='auto';}
    if(computer) openMonitoring();
    else openTerminal();
  }
  var chatForm=$('#form');
  if(chatForm) chatForm.addEventListener('submit',handleEdhyCommand,true);
  window.EdhyTerminal={open:openTerminal,openMonitoring:openMonitoring};
})();
</script>

<script>
(function(){
  var API = 'https://xbot-gamma-hazel.vercel.app/api/research';
  var URL_RE = /https?:\/\/[^\s<>"')]+/i;
  var origFetch = window.fetch;

  window.fetch = async function(input, init){
    try {
      var url = typeof input === 'string' ? input : (input && input.url) || '';
      if (/generativelanguage\.googleapis\.com/.test(url) && init && typeof init.body === 'string'){
        var body = JSON.parse(init.body);
        var msgs = body.contents || [];
        var last = msgs[msgs.length - 1];
        var userTxt = (last && last.role === 'user')
          ? (last.parts || []).map(function(p){ return p.text || ''; }).join(' ')
          : '';
        var m = userTxt.match(URL_RE);
        if (m){
          if (!body.system_instruction) body.system_instruction = { parts: [{ text: '' }] };
          if (!body.system_instruction.parts || !body.system_instruction.parts.length) {
            body.system_instruction.parts = [{ text: '' }];
          }

          var r = await origFetch(API, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ action: 'read', url: m[0] }),
            signal: init.signal
          });

          var d = await r.json().catch(function(){ return {}; });
          if (!r.ok) throw new Error(d.error || ('Edhy gagal membaca halaman (HTTP ' + r.status + ').'));

          var pg = d.sources && d.sources[0];
          if (!pg || !pg.content || !String(pg.content).trim()) {
            throw new Error('Firecrawl tidak mengembalikan isi halaman yang dapat dibaca.');
          }

          body.system_instruction.parts[0].text +=
            '\n\nISI HALAMAN YANG DIMINTA (sumber: ' + pg.url + '):\n' +
            pg.title + '\n' + pg.content +
            '\n\nUtamakan isi halaman di atas sebagai sumber utama. Jangan mengarang isi yang tidak tercantum. Jika pertanyaan juga meminta informasi terbaru atau perbandingan, gunakan alat pencarian yang sudah tersedia bila memungkinkan dan bedakan informasi dari halaman dengan informasi tambahan.';

          init = Object.assign({}, init, { body: JSON.stringify(body) });
        }
      }
    } catch(e){
      if (e) throw e;
    }
    return origFetch.call(this, input, init);
  };
})();
</script>
